name: dogtag_paddleocr
version: 1.0.0
description: Extracts text and locations from dogtag images using PaddleOCR.

entrypoint:
  type: container
  image: arkiverse/dogtag-paddleocr:1.0.0
  command: []

runtime:
  working_dir: /work

inputs:
  - name: image
    type: file
    format: [png, jpg, jpeg, tif, tiff, bmp, webp]
    required: true

outputs:
  - name: output_json
    type: json
    required: true
  - name: text_files
    type: file[]
    format: [txt]
    required: true

parameters:
  - name: lang
    type: string
    required: false
    default: en

  - name: preprocess
    type: boolean
    required: false
    default: true
