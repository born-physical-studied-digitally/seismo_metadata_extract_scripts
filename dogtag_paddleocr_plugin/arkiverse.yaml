name: dogtag_paddleocr
version: 1.0.0
description: Extract text and locations from dogtag images using paddocr.

author:
  name: Brian Kim
  organization: Amaral Lab

entrypoint:
  type: container
  command: python run.py

inputs:
  - name: image
    type: file
    format: [png, jpg, jpeg, tif, tiff, bmp, webp]

  - name: metadata
    type: json
    required: false

outputs:
  - name: extracted_metadata
    type: json
    schema: dublin_core_application_profile

  - name: ocr_text_locations
    type: json

parameters:
  - name: lang
    type: string
    default: en

  - name: preprocess
    type: boolean
    default: true

  - name: output_dir
    type: string
    default: ./outputs

resources:
  cpu: "2"
  memory: "4Gi"
  gpu: false

execution:
  timeout_seconds: 600
  retry_policy: 1
